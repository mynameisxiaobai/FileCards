<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self';"
    />
    <title>归位</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="titlebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none">
            <rect x="1.4" y="1.4" width="13.2" height="13.2" rx="4" fill="currentColor" />
            <rect x="4.2" y="4.6" width="3.2" height="4.6" rx="1" fill="#fff" />
            <rect x="8.6" y="4.6" width="3.2" height="4.6" rx="1" fill="#fff" opacity=".62" />
            <rect x="4.2" y="10.6" width="7.6" height="1.3" rx=".65" fill="#fff" opacity=".9" />
          </svg>
        </span>
        <span class="brand-text">归位</span>
      </div>

      <div class="actions">
        <button id="collect" class="menu-btn" title="收集文件：把一个文件夹里的文件平铺复制到另一个文件夹">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.6 9.6v2.6a1.2 1.2 0 0 0 1.2 1.2h8.4a1.2 1.2 0 0 0 1.2-1.2V9.6" />
            <path d="M8 2.4v6.4M5.7 6.5 8 8.8l2.3-2.3" />
          </svg>
          <span>收集</span>
        </button>
        <button id="add" class="icon-btn" title="添加一张卡片" aria-label="添加卡片">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M8 3.6v8.8M3.6 8h8.8" />
          </svg>
        </button>
        <button id="pin" class="icon-btn" title="窗口置顶" aria-label="窗口置顶">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2.2h4l-.5 3.1 2.1 2v1.2H4.4V7.3l2.1-2z" />
            <path d="M8 9.1v4.4" />
          </svg>
        </button>
        <button id="hide" class="icon-btn" title="隐藏到托盘" aria-label="隐藏到托盘">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M4 8h8" />
          </svg>
        </button>
      </div>
    </header>

    <main id="grid" class="grid" aria-label="归档卡片"></main>

    <!-- 无边框窗口的缩放热区：四条边 + 四个角，共 8 块 -->
    <div class="rz rz-n" data-rz="n"></div>
    <div class="rz rz-s" data-rz="s"></div>
    <div class="rz rz-w" data-rz="w"></div>
    <div class="rz rz-e" data-rz="e"></div>
    <div class="rz rz-nw" data-rz="nw"></div>
    <div class="rz rz-ne" data-rz="ne"></div>
    <div class="rz rz-sw" data-rz="sw"></div>
    <div class="rz rz-se" data-rz="se"></div>

    <div id="scrim" class="scrim is-hidden"></div>

    <div id="detail" class="detail is-hidden">
      <div class="detail-head">
        <span class="detail-title">移动结果</span>
        <button id="detail-close" class="icon-btn" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M4.5 4.5l7 7M11.5 4.5l-7 7" />
          </svg>
        </button>
      </div>
      <ul id="detail-list" class="detail-list"></ul>
    </div>

    <div id="toast" class="toast is-hidden"></div>

    <script src="app.js"></script>
  </body>
</html>
